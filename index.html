<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tingo Tango - Compraventa Internacional</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #16213e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 {
            color: #e94560;
            margin-bottom: 5px;
            font-size: 26px;
        }
        h3 {
            color: #00fff5;
            margin-top: 0;
            font-size: 16px;
            font-weight: 400;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }
        input {
            background-color: #0f3460;
            color: white;
            outline: none;
        }
        button {
            background-color: #e94560;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #00fff5;
            color: #1a1a2e;
        }
        #lista-jugadores {
            list-style: none;
            padding: 0;
            margin: 15px 0;
            max-height: 150px;
            overflow-y: auto;
        }
        #lista-jugadores li {
            background-color: #0f3460;
            padding: 8px;
            margin: 5px 0;
            border-radius: 5px;
        }
        #estado-pantalla {
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #caja-penitencia {
            background-color: #e94560;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            font-size: 18px;
            font-weight: bold;
        }
        .reproductor-cont {
            margin: 15px 0;
            background: #0f3460;
            padding: 10px;
            border-radius: 10px;
        }
        audio {
            width: 100%;
            height: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>TINGO TANGO</h1>
        <h3>Contrato de Compraventa Internacional</h3>

        <div class="reproductor-cont">
            <p style="margin: 0 0 5px 0; font-size: 12px; color: #00fff5;">🎵 Música en vivo (Se Vale Too):</p>
            <audio id="musica-fondo" controls loop preload="auto">
                <source src="https://ia801503.us.archive.org/15/items/se-vale-too-los-de-la-pina/Se%20Vale%20Too%20-%20Los%20De%20La%20Pina.mp3" type="audio/mpeg">
                Tu navegador no soporta el reproductor de audio.
            </audio>
        </div>

        <div id="seccion-registro">
            <input type="text" id="nombre-jugador" placeholder="Escribe tu nombre..." />
            <button onclick="registrar()">Unirse al Juego</button>
        </div>

        <div id="seccion-juego" style="display:none;">
            <h4>Jugadores Conectados:</h4>
            <ul id="lista-jugadores"></ul>

            <div id="estado-pantalla">Esperando inicio...</div>

            <button id="btn-iniciar" onclick="iniciarRonda()">¡Iniciar Ronda!</button>

            <div id="caja-penitencia"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let miNombre = "";
        const musica = document.getElementById('musica-fondo');
        
        // Ajuste de volumen al máximo (1.0)
        musica.volume = 1.0;

        // Efecto sonoro de alerta cuando cae el TANGO
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function sonarTango() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.2);
        }

        function registrar() {
            const nombre = document.getElementById('nombre-jugador').value.trim();
            if (!nombre) return alert("Por favor ingresa tu nombre");
            miNombre = nombre;
            
            // Probar reproductor y habilitar audio
            musica.play().then(() => {
                musica.pause();
                musica.currentTime = 0;
            }).catch(e => console.log("Permiso de audio pendiente:", e));

            socket.emit('unirse', nombre);
            document.getElementById('seccion-registro').style.display = 'none';
            document.getElementById('seccion-juego').style.display = 'block';
        }

        function iniciarRonda() {
            document.getElementById('caja-penitencia').style.display = 'none';
            socket.emit('iniciarJuego');
        }

        socket.on('actualizarJugadores', (jugadores) => {
            const lista = document.getElementById('lista-jugadores');
            lista.innerHTML = jugadores.map(j => `<li>${j.nombre}</li>`).join('');
        });

        socket.on('estadoPelota', (data) => {
            document.getElementById('estado-pantalla').innerHTML = `⚽ La pelota la tiene: <br><b style="color:#00fff5; font-size:24px;">${data.poseedor.nombre}</b>`;
            
            // Inicia la música a todo volumen mientras la pelota pasa entre los participantes
            if (musica.paused) {
                musica.volume = 1.0;
                musica.play().catch(e => console.log("Haga clic en Play en el reproductor si no suena:", e));
            }
        });

        socket.on('tangoFinal', (data) => {
            // Se corta la música al instante al caer el TANGO
            musica.pause();
            musica.currentTime = 0;
            
            sonarTango();
            document.getElementById('estado-pantalla').innerHTML = `💥 ¡TANGO! 💥`;
            
            const caja = document.getElementById('caja-penitencia');
            caja.style.display = 'block';
            caja.innerHTML = `⚠️ <b>${data.perdedor.nombre}</b> le toca responder:<br><br><i>"${data.penitencia}"</i>`;
        });
    </script>
</body>
</html>
